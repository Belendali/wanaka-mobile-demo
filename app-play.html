<title>Wanaka 边玩边改</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
/* Play & comment, portrait: the user journey from Figma "1117 create" → P1–P10.
   Every screen is exported straight from the board (2x webp in media/play/); taps move between them.
   Single dark look on purpose: the app itself is dark (Wanaka Foundations). */
:root{
  --ink:#140E10; --lime:#C0F000;
  --stage:#0C0809; --stage-line:#2A2225; --guide-fg:#E9E2E4; --guide-dim:#9D9295;
  --font:"Poppins",ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* ---------- stage ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.guide{width:340px;flex:none;color:var(--guide-fg);display:flex;flex-direction:column;gap:20px;max-height:100%;overflow:auto;scrollbar-width:none}
.guide h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.guide .sub{margin:6px 0 0;font-size:13px;color:var(--guide-dim);line-height:1.6}
.guide h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--guide-dim);font-weight:500;margin:0 0 8px}

/* journey */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:s}
.steps button{width:100%;display:grid;grid-template-columns:22px 1fr;gap:2px 10px;text-align:left;padding:8px 10px;border-radius:12px;transition:background .15s}
.steps button:hover{background:rgba(255,255,255,.05)}
.steps .n{grid-row:span 2;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;
  background:rgba(255,255,255,.07);color:var(--guide-dim);margin-top:1px}
.steps b{font-size:13.5px;font-weight:500;line-height:1.45;color:var(--guide-dim)}
.steps .d{font-size:12px;line-height:1.55;color:var(--guide-dim);display:none}
.steps .done .n{background:rgba(192,240,0,.16);color:var(--lime)}
.steps .done b{color:var(--guide-fg)}
.steps .on{background:rgba(192,240,0,.07);box-shadow:inset 0 0 0 1px rgba(192,240,0,.5)}
.steps .on .n{background:var(--lime);color:var(--ink)}
.steps .on b{color:var(--lime);font-weight:600}
.steps .on .d{display:block;color:var(--guide-fg)}
.phase{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--guide-dim);opacity:.7;padding:10px 10px 4px}
.phase:first-child{padding-top:0}

.now{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 12px 14px;border-radius:14px;background:rgba(255,255,255,.05)}
.now span{font-size:13px;line-height:1.4}
.now span em{font-style:normal;color:var(--lime);font-weight:500}
.nav{display:flex;gap:6px;flex:none}
.nav button{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:15px}
.nav button:hover{background:rgba(255,255,255,.14)}
.nav button:disabled{opacity:.3;cursor:default}
.nav button.cue{background:var(--lime);color:var(--ink);animation:keycue 1.4s ease-in-out infinite}
.guide .note{font-size:12px;line-height:1.65;color:var(--guide-dim);border-top:1px solid var(--stage-line);padding-top:14px;margin:0}
.guide .note a{color:var(--guide-fg);text-decoration:underline;text-underline-offset:3px}

/* compact bar when the guide is hidden */
.mini{display:none;align-items:center;gap:10px;width:100%;max-width:420px;box-sizing:border-box}
.mini .txt{flex:1;min-width:0;font-size:12.5px;line-height:1.4;color:var(--guide-fg)}
.mini .txt b{color:var(--lime);font-weight:600;margin-right:6px}
.mini .txt span{color:var(--guide-dim)}

/* ---------- device ---------- */
.devwrap{flex:none;position:relative}
.device{position:relative;width:max-content;border-radius:62px;padding:10px;box-sizing:content-box;background:#1D1719;transform-origin:top left;
  box-shadow:0 0 0 1px #2c2427,0 40px 80px -30px rgba(0,0,0,.8)}
.app{width:393px;height:852px;border-radius:52px;overflow:hidden;overflow:clip;position:relative;background:#000;isolation:isolate;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.app img{-webkit-user-drag:none;user-select:none}
.scr{position:absolute;inset:0;width:100%;height:100%;display:block}
.scr.in{animation:inFade .3s ease both}
.scr.lockin{animation:lockIn .45s ease both}
.scr.unlock{animation:unlock .42s cubic-bezier(.2,.85,.25,1) both}
.slow{transition:opacity 1.1s ease}
@keyframes inFade{from{opacity:0}}
@keyframes lockIn{0%{opacity:0;filter:brightness(0)}100%{opacity:1;filter:none}}
@keyframes unlock{from{opacity:0;transform:scale(1.06)}}
#hots{position:absolute;inset:0;z-index:5}
.hot{position:absolute;border-radius:14px;outline:2px solid transparent;outline-offset:-2px;transition:background .15s,outline-color .15s;cursor:pointer}
.hot:active{background:rgba(255,255,255,.08)}
.flash .hot{outline-color:rgba(192,240,0,.95);background:rgba(192,240,0,.14)}
/* "tap here" pulse on the main action */
.hot.main::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(192,240,0,.55);animation:ping 1.8s ease-out 1.2s infinite}
.hot.big.main::after{display:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(192,240,0,.5)}70%{box-shadow:0 0 0 10px rgba(192,240,0,0)}100%{box-shadow:0 0 0 0 rgba(192,240,0,0)}}
/* ---------- motion on top of the board screens ---------- */
.scr>.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fxl{position:absolute;pointer-events:none}
.fxl>img{display:block;width:100%;height:100%}
.glass{overflow:hidden;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.drop{animation:drop .55s cubic-bezier(.3,1.45,.5,1) .1s both}
.pop{animation:pop .42s cubic-bezier(.2,1.25,.4,1) .32s both;transform-origin:100% 0}
.slide{animation:slide .55s cubic-bezier(.2,1.15,.3,1) .18s both}
@keyframes drop{from{transform:translateY(-30px) scale(.55);opacity:0}}
@keyframes pop{from{transform:scale(.88);opacity:0}}
@keyframes slide{from{transform:translateY(-24px);opacity:0}}
/* Wana is listening: a ring keeps pulsing out of the pin */
.ring{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid rgba(212,250,0,.85);opacity:0;animation:ring 1.5s ease-out .6s infinite}
@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2);opacity:0}}
/* voice level bars, driven from script */
.wv i{position:absolute;background:#D4FA00;border-radius:2px;transform-origin:50% 50%;transition:transform .1s linear}
/* progress fills and the "working" spinner */
.fill{background:#D4FA00}
.spin{box-sizing:border-box;border-radius:50%;border:2px solid rgba(255,255,255,.28);border-top-color:#fff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
/* the torch keeps flickering while the game runs (it stops when the game is paused) */
.flick{width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,176,80,.5),rgba(255,140,40,.16) 42%,rgba(255,120,30,0) 70%);animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%{opacity:.55;transform:scale(1)}14%{opacity:.85;transform:scale(1.06)}27%{opacity:.6;transform:scale(.98)}41%{opacity:.95;transform:scale(1.08)}
  55%{opacity:.5;transform:scale(.97)}68%{opacity:.8;transform:scale(1.04)}83%{opacity:.62;transform:scale(1)}100%{opacity:.55;transform:scale(1)}}

/* tap ripple where the finger lands on the paused game */
.tap{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid rgba(255,255,255,.9);pointer-events:none;animation:tap .45s ease-out forwards}
@keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(1.4);opacity:0}}

/* side button: locks the phone */
.sidekey{position:absolute;right:-4px;top:210px;width:5px;height:84px;border-radius:0 3px 3px 0;background:#3a3034;cursor:pointer;z-index:2}
.sidekey::before{content:"";position:absolute;inset:-10px -16px -10px -6px}
.sidekey.cue{background:var(--lime);animation:keycue 1.4s ease-in-out infinite}
.sidekey .tip{position:absolute;left:18px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;font-weight:500;color:var(--ink);
  background:var(--lime);padding:6px 10px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s}
.sidekey.cue .tip{opacity:1}
@keyframes keycue{50%{box-shadow:0 0 0 4px rgba(192,240,0,.25)}}

@media (max-width:820px){
  .guide{display:none}
  .stage{flex-direction:column;gap:12px}
  .mini{display:flex}
}
/* real phone: the demo is the whole screen */
@media (max-width:560px){
  .stage{padding:8px 0 0;gap:8px;justify-content:flex-start}
  .mini{padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px))}
  .device{padding:0;border-radius:0;background:none;box-shadow:none}
  .app{border-radius:0}
  .sidekey{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="stage">
  <aside class="guide" aria-label="Demo guide">
    <div>
      <h1>Wanaka · 边玩边改</h1>
      <p class="sub">玩的时候看到想改的，点一下画面、说一句就记下来；攒几条一起发，Wana 在后台做下一版，你不用停下来等。</p>
    </div>
    <div>
      <h2>用户旅程</h2>
      <ol class="steps" id="steps"></ol>
    </div>
    <div class="now">
      <span id="now"></span>
      <div class="nav"><button type="button" id="prev" aria-label="上一步">←</button><button type="button" id="next" aria-label="下一步">→</button></div>
    </div>
    <p class="note">画面全部来自 Figma「1117 create」里 Play &amp; comment · portrait 那一排（P1–P10）。点亮的绿框就是下一步要点的地方，点空白处会提示。</p>
  </aside>
  <div class="mini" id="mini">
    <div class="txt" id="minitxt"></div>
    <div class="nav"><button type="button" id="mprev" aria-label="上一步">←</button><button type="button" id="mnext" aria-label="下一步">→</button></div>
  </div>
  <div class="devwrap" id="devwrap">
    <div class="device" id="device">
      <div class="app" id="app">
        <div id="hots"></div>
      </div>
      <button type="button" class="sidekey" id="sidekey" aria-label="侧边键 · 锁屏"><span class="tip">按侧边键锁屏</span></button>
    </div>
  </div>
</div>
<script>
const M='media/play/', W=393, H=852;
const $=s=>document.querySelector(s);
/* One entry per board frame. hot = [x,y,w,h,go] in frame points; the first is the main action. */
const STEPS=[
  {k:'p1', ph:'记下想改的', t:'玩 V1', d:'游戏占满上方，底部只有 Play | Comment 两个模式。', act:'点 <em>Comment</em>',
    hot:[[199,776,175,46,2]]},
  {k:'p2', t:'切到 Comment，游戏暂停', d:'画面变暗、停住。想改哪里就点哪里。', act:'点画面上 <em>任意位置</em>',
    hot:[[0,150,393,600,3,'big'],[20,776,175,46,1]]},
  {k:'p3', t:'点一个位置，直接说', d:'那里落下一个钉子，Wana 开始听。不用打字，说一句要改什么。', act:'说完点 <em>✓</em>',
    hot:[[328,777,44,44,4],[21,777,44,44,2]]},
  {k:'p4', t:'可以连着记好几条', d:'再点别的位置说下一条（这里已经记了 2 条）。也可以点 Play 继续玩。', act:'点 <em>Play</em> 接着玩',
    hot:[[20,776,123,46,5]]},
  {k:'p5', ph:'接着玩', t:'笔记在 Send 里等着', d:'游戏继续，记下的 2 条都留在 Send · 2 里，不会丢。', act:'又看到问题，点 <em>Comment</em>',
    hot:[[147,776,123,46,6]]},
  {k:'p6', t:'再记一条', d:'暂停、点哥布林、说一句，第 3 条加进来。Send 变成 Send · 3。', act:'点 <em>Send · 3</em>',
    hot:[[282,772,95,54,7]]},
  {k:'p7', ph:'Wana 做下一版', t:'一起发出去，继续玩 V1', d:'Wana 开始做 V2，进度条在顶部。你继续玩 V1，不用等。', act:'按手机 <em>侧边键</em> 锁屏', actPhone:'点右上角 <em>→</em> 锁屏，离开游戏',
    hot:[], side:8},
  {k:'p8', t:'离开游戏也知道进度', d:'锁屏上的实时活动显示 Wana 做到第几条、还要多久。', act:'点 <em>实时活动</em> 回到游戏',
    hot:[[12,560,369,178,9]]},
  {k:'p9', ph:'玩新版本', t:'V2 好了，一点就玩', d:'回到游戏，顶部提示 3 条都改好了。', act:'点 <em>Play V2</em>',
    hot:[[263,117,104,40,10]]},
  {k:'p10', t:'玩 V2', d:'先列出这一版改了什么，几秒后自动淡出，回到游戏本身。', act:'走完了，<em>→</em> 从头再来',
    hot:[]},
];
const S={i:0, timers:[], waves:[]};
const app=$('#app'), hots=$('#hots');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const img=k=>{const i=new Image(); i.src=M+k+'.webp'; i.alt=''; i.draggable=false; return i;};

/* ---------- motion ----------
   Screens with motion use a "-base" export (the moving layers hidden in Figma) and the layers on top:
   the pin, the note and the banners are exported on their own; bars, rings and the spinner are drawn here.
   Positions are the Figma frame points. */
function layer(p,x,y,w,h,cls,o={}){
  const d=document.createElement('div'); d.className='fxl'+(cls?' '+cls:'')+(o.blur?' glass':'');
  Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  if(o.blur){ d.style.setProperty('--blur',o.blur+'px'); d.style.borderRadius=o.r+'px'; }
  if(o.img) d.append(img(o.img)); p.append(d); return d;
}
/* level bars: xs = left edge of each bar, cy = centre line, mx = tallest bar */
function wave(p,xs,w,cy,mx,dim){
  const box=layer(p,0,0,0,0,'wv'), bars=xs.map((x,j)=>{ const b=document.createElement('i');
    Object.assign(b.style,{left:x+'px',top:cy-mx/2+'px',width:w+'px',height:mx+'px',opacity:j>=dim?.35:1}); b.style.transform='scaleY(.25)'; box.append(b); return b; });
  S.waves.push({bars,mx});
}
/* a progress fill that first catches up, then keeps creeping */
function fill(p,x,y,h,r,from,to,later){
  const f=layer(p,x,y,from,h,'fill'); f.style.borderRadius=r+'px';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ f.style.transition='width 1.3s cubic-bezier(.2,.8,.2,1) .45s'; f.style.width=to+'px'; }));
  S.timers.push(setTimeout(()=>{ f.style.transition='width 40s linear'; f.style.width=later+'px'; },1900));
}
const FLAME={p1:[226,329],p5:[114,65],p7:[114,65],p9:[114,65],p10:[225,328]};
const MOTION={
  p3:{base:'p3-base', build:s=>{
    layer(s,314,159,52,52,'drop',{img:'o-pin'});
    layer(s,340,185,0,0,'',{}).append(Object.assign(document.createElement('div'),{className:'fxl ring'}));
    const note=layer(s,128,170,186,76.5,'pop',{img:'o-note',blur:12,r:14});
    wave(note,[13,17,21,25],2,58.5,10,9);
    wave(s,Array.from({length:14},(_,j)=>156+6*j),3,799,24,9);
  }},
  p7:{base:'p7-base', build:s=>{ const b=layer(s,47,106,299.5,72.5,'slide',{img:'o-making',blur:14,r:20}); fill(b,10,57,4,2,0,70,150); }},
  p8:{base:'p8-base', build:s=>{ fill(s,28,629,5,3,170,225,262); layer(s,30,706,12,12,'spin'); }},
  p9:{base:'p9-base', build:s=>{ layer(s,16,106,361,60.5,'slide',{img:'o-ready',blur:14,r:22}); }},
};
function screen(k){
  const s=document.createElement('div'), m=MOTION[k]; s.className='scr';
  const bg=img(m?m.base:k); bg.className='bg'; s.append(bg);
  if(FLAME[k]) layer(s,FLAME[k][0],FLAME[k][1],0,0,'').append(Object.assign(document.createElement('div'),{className:'fxl flick'}));
  if(m) m.build(s);
  return s;
}
/* voice: loud words with short gaps, every bar a little different */
let tick=0;
setInterval(()=>{ if(calm||!S.waves.length) return; tick++;
  const t=tick*.11, word=Math.sin(t*2.3)+Math.sin(t*.9+1)>-.7, env=word?.45+.55*Math.abs(Math.sin(t*3.7)*Math.cos(t*1.3)):.12;
  S.waves.forEach(wv=>wv.bars.forEach(b=>{ const v=Math.max(.16,Math.min(1,env*(.35+.75*Math.random()))); b.style.transform=`scaleY(${v.toFixed(2)})`; }));
},100);

function clearTimers(){ S.timers.forEach(clearTimeout); S.timers=[]; }
function show(n, how){
  clearTimers(); S.waves=[];
  n=(n+STEPS.length)%STEPS.length; const st=STEPS[n], prev=S.i; S.i=n;
  const old=[...app.querySelectorAll(':scope>.scr')], i=screen(st.k);
  i.classList.add(how||'in'); app.insertBefore(i,hots);
  S.timers.push(setTimeout(()=>old.forEach(o=>o.remove()),500));
  /* P10: the "New in V2" list fades away by itself */
  if(st.k==='p10'){ S.timers.push(setTimeout(()=>{ const f=img('p10-faded'); f.className='bg slow'; f.style.opacity=0; i.insertBefore(f,i.children[1]||null);
    requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.opacity=1)); },3200)); }
  hots.innerHTML='';
  st.hot.forEach((h,j)=>{ const b=document.createElement('button'); b.type='button'; b.className='hot'+(j===0?' main':'')+(h[5]?' '+h[5]:'');
    Object.assign(b.style,{left:h[0]+'px',top:h[1]+'px',width:h[2]+'px',height:h[3]+'px'});
    b.addEventListener('click',e=>{ e.stopPropagation(); go(h[4]-1, e); }); hots.append(b); });
  $('#sidekey').classList.toggle('cue', !!st.side);
  render();
}
/* how each move looks: locking goes dark first, unlocking zooms back in */
function go(n, e){
  const from=STEPS[S.i].k, to=STEPS[(n+STEPS.length)%STEPS.length].k;
  if(from==='p2' && to==='p3' && e){ const r=app.getBoundingClientRect(), s=r.width/W, t=document.createElement('div'); t.className='tap';
    t.style.left=(e.clientX-r.left)/s+'px'; t.style.top=(e.clientY-r.top)/s+'px'; app.append(t); setTimeout(()=>t.remove(),460);
    return setTimeout(()=>show(n),160); }
  show(n, to==='p8'?'lockin':from==='p8'?'unlock':'in');
}
/* a tap that misses: light up where to tap */
hots.addEventListener('click',e=>{ if(e.target!==hots) return; app.classList.remove('flash'); void app.offsetWidth; app.classList.add('flash'); setTimeout(()=>app.classList.remove('flash'),650); });
$('#sidekey').addEventListener('click',()=>{ const st=STEPS[S.i]; if(st.side) go(st.side-1); else { const k=$('#sidekey'); k.classList.add('cue'); setTimeout(()=>k.classList.remove('cue'),900); } });

function render(){
  const ol=$('#steps'); ol.innerHTML='';
  STEPS.forEach((st,n)=>{
    if(st.ph){ const p=document.createElement('li'); p.className='phase'; p.textContent=st.ph; ol.append(p); }
    const li=document.createElement('li'), b=document.createElement('button'); b.type='button';
    b.className=n===S.i?'on':n<S.i?'done':'';
    b.innerHTML=`<span class="n">${n+1}</span><b>${st.t}</b><span class="d">${st.d}</span>`;
    b.onclick=()=>show(n); li.append(b); ol.append(li);
  });
  const st=STEPS[S.i], noKey=getComputedStyle($('#sidekey')).display==='none', act=(noKey&&st.actPhone)||st.act;
  $('#now').innerHTML=act;
  $('#minitxt').innerHTML=`<b>${S.i+1}/${STEPS.length}</b>${st.t}<br><span>${act.replace(/<\/?em>/g,'')}</span>`;
  $('#mnext').classList.toggle('cue', noKey&&!!st.side);
  $('#prev').disabled=$('#mprev').disabled=S.i===0;
  const on=ol.querySelector('.on'); if(on) on.scrollIntoView({block:'nearest'});
}
const next=()=>go(S.i+1), prev=()=>show(S.i-1);
$('#next').onclick=$('#mnext').onclick=next; $('#prev').onclick=$('#mprev').onclick=prev;
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') next(); else if(e.key==='ArrowLeft'&&S.i>0) prev(); });

function fit(){
  const w=$('#devwrap'), d=$('#device'), phone=innerWidth<=560;
  const miniH=getComputedStyle($('#mini')).display==='none'?0:$('#mini').offsetHeight+12;
  const bez=phone?0:20, availH=innerHeight-(phone?8:48)-miniH, availW=innerWidth-(phone?0:32);
  const s=Math.min(phone?9:1,availH/(H+bez),availW/(W+bez));
  d.style.transform=`scale(${s})`; w.style.width=(W+bez)*s+'px'; w.style.height=(H+bez)*s+'px';
}
addEventListener('resize',()=>{ fit(); render(); });
if(document.fonts) document.fonts.ready.then(fit);
addEventListener('load',fit);

show(start>=1&&start<=STEPS.length?start-1:0); fit();
